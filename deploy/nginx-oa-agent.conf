# Reverse proxy for the self-hosted OA agent.
#
# The application binds to 127.0.0.1:3000 and is only reachable through nginx.
# Uploads go straight from the browser to Aliyun OSS with presigned PUTs, so the
# body limit here only needs to cover JSON requests.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Uploads are proxied through the app to object storage, so the body limit
    # must cover the largest accepted case file.
    client_max_body_size 512m;
    client_body_timeout 300s;

    # Keep the public surface minimal: the worker's HTTP port is not exposed,
    # and it is only used for a local health check.
    location = /healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        # Stream request bodies instead of spooling them to disk first.
        proxy_request_buffering off;
    }
}
