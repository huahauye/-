[build]
command = "pnpm --filter @oa/web build"
publish = "apps/web/.next"
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "22"
PNPM_VERSION = "11.19.0"
PNPM_FLAGS = "--frozen-lockfile"

[dev]
command = "pnpm --filter @oa/web dev"
targetPort = 3000
port = 8888

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.netlify.app https://*.netlify.com https://*.r2.cloudflarestorage.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[context.deploy-preview.environment]
APP_ENV = "deploy-preview"

[context.production.environment]
APP_ENV = "production"
