name: Deploy to Netlify

# Netlify's free plan blocks git-triggered builds for commits from contributors
# it cannot verify on a private repository. This workflow builds on a Linux
# runner instead — the same platform Netlify uses — and uploads the result as a
# manual deploy, which is not subject to that check.
#
# Required repository secret: NETLIFY_AUTH_TOKEN
#   Netlify -> User settings -> Applications -> Personal access tokens -> New access token

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    if: ${{ !startsWith(github.event.head_commit.message, '[ci-log]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 600dc8f9-7092-4ba7-8caa-bdd759e952a4
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee ci-deploy.log

      - name: Typecheck
        run: |
          set -o pipefail
          pnpm --filter @oa/web typecheck 2>&1 | tee -a ci-deploy.log

      - name: Check document worker sources
        run: |
          set -o pipefail
          python -m compileall -q services/document-worker/app services/document-worker/scripts 2>&1 | tee -a ci-deploy.log

      - name: Show which project the CLI resolves
        continue-on-error: true
        env:
          CI: "true"
        run: |
          npx --yes netlify-cli@27.8.0 status 2>&1 | tee -a ci-deploy.log || true
          echo "--- NETLIFY_SITE_ID=${NETLIFY_SITE_ID} ---" | tee -a ci-deploy.log

      # pipefail matters: without it the pipeline exit status is tee's, so a
      # failed deploy would be reported as a success and ship nothing.
      - name: Build and deploy to production
        id: deploy
        continue-on-error: true
        run: |
          set -o pipefail
          npx --yes netlify-cli@27.8.0 deploy --build --prod --filter @oa/web 2>&1 | tee -a ci-deploy.log

      - name: Publish the run log
        if: always()
        run: |
          echo "" >> ci-deploy.log
          echo "=== deploy step outcome: ${{ steps.deploy.outcome }} ===" >> ci-deploy.log
          echo "=== runner: $(node --version) / pnpm $(pnpm --version) ===" >> ci-deploy.log
          git config user.name "ci-log"
          git config user.email "ci-log@users.noreply.github.com"
          git add -f ci-deploy.log
          if git diff --cached --quiet; then
            echo "no log changes"
          else
            git commit -m "[ci-log] deploy run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase origin main || true
            git push origin main
          fi

      - name: Fail when the deploy failed
        if: steps.deploy.outcome != 'success'
        run: exit 1
